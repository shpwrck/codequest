<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Quest Advance</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <div id="stage">
      <div id="shell-scale">
        <svg id="shoulders" viewBox="-20 -20 618 368" aria-hidden="true">
          <defs>
            <linearGradient id="shldGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#dfe0ec"/>
              <stop offset="1" stop-color="#b4b5ca"/>
            </linearGradient>
          </defs>
          <path id="shoulder-l" data-btn="l" class="shoulder-btn" d="M 135 2 C 100 0, 56 8, 26 22 C 12 30, 2 40, -2 52 C -3 58, 1 64, 7 64 C 40 56, 90 30, 135 2 Z"
                fill="url(#shldGrad)" stroke="#101124" stroke-width="3"/>
          <path id="shoulder-r" data-btn="r" class="shoulder-btn" d="M 443 2 C 478 0, 522 8, 552 22 C 566 30, 576 40, 580 52 C 581 58, 577 64, 571 64 C 538 56, 488 30, 443 2 Z"
                fill="url(#shldGrad)" stroke="#101124" stroke-width="3"/>
        </svg>

        <div id="cart-back" class="empty" title="CARTRIDGE SLOT"></div>

        <div id="shell">
          <div id="bezel">
            <div id="screen">
              <div id="screen-inner">
                <canvas id="engine-canvas" width="240" height="160" aria-label="Bevy game display"></canvas>
                <div id="device-boot" aria-hidden="true">
                  <div class="boot-logo">
                    <div class="boot-word">CODEQUEST<div class="boot-shine"></div></div>
                    <div class="boot-maker"><span>CQA SYSTEM</span></div>
                  </div>
                </div>
              </div>
              <div id="scanlines"></div>
              <div id="screen-shade"></div>
            </div>
          </div>
          <div class="bezel-caption"><span class="cap-solid">CODEQUEST</span><span class="cap-outline">ADVANCE</span></div>
          <div class="power-led off"></div>

          <div id="dpad">
            <div class="dpad-btn dpad-up" data-btn="up"></div>
            <div class="dpad-btn dpad-down" data-btn="down"></div>
            <div class="dpad-btn dpad-left" data-btn="left"></div>
            <div class="dpad-btn dpad-right" data-btn="right"></div>
            <div class="dpad-core"></div>
          </div>
          <div class="ab" id="btn-a" data-btn="a"><span>A</span></div>
          <div class="ab" id="btn-b" data-btn="b"><span>B</span></div>
          <div class="ab-label" id="lab-a">X KEY</div>
          <div class="ab-label" id="lab-b">Z KEY</div>
          <div class="pill" id="btn-select" data-btn="select"><span>SELECT</span></div>
          <div class="pill" id="btn-start" data-btn="start"><span>START</span></div>
          <div class="speaker"></div>
          <div id="power-switch" title="POWER"><span class="ps-nub"></span></div>
          <div class="shell-tag">CQA-001</div>
        </div>
      </div>
      <div id="cart-tray" class="hidden">
        <div class="tray-panel">
          <div class="tray-head">SELECT CARTRIDGE</div>
          <div id="tray-carts"></div>
          <div id="tray-error" class="hidden"></div>
          <div class="tray-hint">CLICK TO INSERT &middot; ESC TO CLOSE &middot; SWAP WITH POWER OFF</div>
        </div>
      </div>
    </div>
  </body>
</html>
