# CODEQUEST.toml schema version 2
schema_version = 2

[game]
type = "quiz"
title = "CODE QUEST ADVANCE"
summary = "Learn a software project by exploring its world and answering conceptual questions."
start_scene = "copyright"

[[mechanics]]
id = "present-copyright"
summary = "Credit the repository's authors and establish its real development timeline while the first questions are requested."
inputs = ["a", "start"]
rules = ["Read authors and earliest/latest commit dates from repository data.", "Credit up to three git authors using git shortlog's commit-count ranking.", "Show an explicit copyright owner only when the repository declares one.", "Begin question generation when the cartridge is accepted; this scene must not delay it.", "A or Start may skip after a readable minimum dwell, and the scene otherwise advances automatically."]
feedback = ["Reveal author names and timeline landmarks in a short, legible sequence.", "Use no progress percentage or claim that questions are ready.", "Begin in intentional near-silence and pair each reveal with one dry archival tick."]

[[mechanics]]
id = "play-opening-fanfare"
summary = "Play a finite original spectacle while first-round question generation continues in the background."
inputs = ["a", "start"]
rules = ["The sequence lasts five to seven seconds when unskipped.", "A or Start may skip after the opening impact has been readable for 1.5 seconds.", "Finishing the fanfare does not imply that a question is ready."]
feedback = ["Follow one code-seer from a dormant source ember through an answering archive, an opened memory vault, cyan-and-gold convergence, and the complete bright Oracle crescendo.", "Give every story beat its own authored 240x160 composition rather than treating one plate as a glow surface.", "Grow sound from one node pulse to the full Oracle cadence in sync with the luminance arc.", "Use clean staged cuts rather than flashes, and hand the Oracle motif to a freshly rendered, restrained title frame without leaking fanfare layers across the scene boundary."]

[[mechanics]]
id = "begin-from-title"
summary = "Accept the Oracle's invitation and enter the quiz menu."
inputs = ["a", "start"]
rules = ["A or Start continues on its input edge.", "The title remains idle when no playable cartridge is present."]
feedback = ["Pulse the prompt without competing with the title.", "Play one confirmation response and hand off cleanly to the menu."]

[[mechanics]]
id = "navigate-menu"
summary = "Move through a short list and confirm or go back."
inputs = ["d-pad", "a", "b", "start"]
rules = ["The current choice is always visible.", "Confirm advances to the selected destination."]
feedback = ["Highlight the current choice by pointer, shape, and color.", "Use distinct navigation, confirmation, cancellation, and unavailable responses.", "Emit at most one response per input edge and do not stack cues across scene transitions."]

[[mechanics]]
id = "customize-hero"
summary = "Choose the hero name, path, and aura before beginning a run."
inputs = ["d-pad", "a", "b", "start"]
rules = ["Each row edits one hero trait.", "The selected hero persists for the run."]
feedback = ["Update each identity label immediately; aura changes the authored hero colorway without layering procedural equipment over it.", "Pair each changed trait with one short response variant and reserve the Oracle cadence for final confirmation."]

[[mechanics]]
id = "consult-oracle"
summary = "Play Oracle Datafall while the next question is prepared."
inputs = ["left", "right", "b"]
rules = ["Data packets and bugs fall in deterministic lanes while the Oracle holds the run for a valid question.", "Left and Right move the hero to dodge bugs or line up with data.", "B abandons the wait and returns to the quiz menu on its input edge.", "Contact with data increments the data counter automatically; contact with a bug increments the bug counter.", "Data charge lights a seal at 3, 6, and 9 collected shards; corruption breaks a containment seal at 1, 3, and 5 bug hits.", "Up, Down, A, Start, and shoulders do nothing in this scene, so their input cannot carry into a newly loaded question.", "Datafall counters and their staged seals are expressive rewards and warnings; they never change quiz score, wards, question timing, or generation.", "A failed generation attempt is retried instead of replaced with filler."]
feedback = ["Use distinct authored crystal and corruption silhouettes in addition to green and red.", "Keep Oracle Datafall and truthful Claude status in the top quiz header.", "Keep the data count, bug count, three charging runes, three breakable containment runes, and move/back prompts in the bottom game strip.", "Show loading, retry, and ready status without a percentage.", "Give each data-charge and corruption-breach threshold a legible fill/fracture state plus distinct response while keeping ambience below quiz feedback."]

[[mechanics]]
id = "answer-question"
summary = "Choose one of four answers to a conceptual project question."
inputs = ["d-pad", "a", "b"]
rules = ["Exactly one answer is correct.", "A wrong answer costs one ward and resets flow; three, two, one, and zero wards are full, strained, fractured, and broken stages.", "Correct answers build flow: streaks 0-2 award x1 score, 3-5 award x2, and 6 or more award x3.", "Cumulative score awakens Insight Runes I, II, and III at 300, 900, and 1800 points.", "Committing an answer records that question in the cartridge save; future runs and launches skip every recorded question.", "After commitment, hold the revealed answer for 45 ticks; all inputs are intentionally inactive until the automatic transition completes."]
feedback = ["Reveal whether the answer was correct through text, shape, animation, and color.", "Show the correct answer after a mistake.", "Use three authored Oracle ward runes for health instead of generic pips; communicate full, strained, fractured, and broken states through fill, count, color, and a concise review banner.", "Show flow multiplier, raw score, and three awakening Insight Rune marks together; announce exact threshold crossings before establishing the new baseline.", "Replace active answer/back prompts with the owned review, ward, flow, or rune response during the 45-tick result hold."]

[[mechanics]]
id = "continue-after-reward"
summary = "Hold the earned level long enough to read it, then continue toward the next question."
inputs = ["a", "start"]
rules = ["The reward remains non-interactive for its first 60 ticks so the new state is readable.", "A or Start continues on its input edge after that hold.", "Continue to the quiz when a valid question is ready; otherwise continue to the Oracle.", "A held confirmation cannot answer the next question."]
feedback = ["Telegraph the threshold, celebrate it once, and hold the new crest state.", "Use one tier-specific continuation response without stacking it into the next scene."]

[[mechanics]]
id = "replay-run"
summary = "Close the completed run and return to the quiz menu."
inputs = ["a", "b", "start"]
rules = ["A, B, or Start returns to the quiz menu on its input edge.", "Beginning the next run resets run-specific counters and presentation tier."]
feedback = ["Show final score, level, and earned crest before prompting.", "Use one result-to-menu response and make the eventual Initiate reset explicit."]

[[art]]
id = "copyright-card"
kind = "ui"
summary = "A copyright-style provenance card for repository authors and development history."
template = "oracle-chronicle"
requirements = ["Fits repository title, up to three credited author lines, and earliest-to-latest commit dates inside 240x160.", "Uses the same rune-and-circuit frame language as gameplay while remaining deliberately dormant with no emissive glow.", "Uses explicit copyright wording only when supported by repository metadata.", "Supports missing provenance without shrinking body text.", "Owns readable reveal and skip states rather than behaving like an unstyled disclaimer."]

[[art]]
id = "opening-source"
kind = "scene"
summary = "A lone code-seer discovers the first cyan source ember in a dormant archive cathedral."
template = "oracle-awakening"
requirements = ["Uses an authored 240x160 plate with a small readable code-seer, a deep layered cathedral, and one cyan focal ember.", "Contains no Oracle sigil or gold energy so later beats can earn them.", "Keeps the live skip region visually quiet."]

[[art]]
id = "opening-signal"
kind = "scene"
summary = "The source ember answers through the altar and wakes the nearest archive monoliths."
template = "oracle-awakening"
requirements = ["Uses an authored 240x160 plate distinct from the source scene.", "Preserves the code-seer silhouette and cathedral material language while expanding cyan illumination.", "Contains no completed Oracle sigil or gold energy."]

[[art]]
id = "opening-archive"
kind = "scene"
summary = "The archive opens into a canyon of commit constellations and branching memory."
template = "oracle-awakening"
requirements = ["Uses an authored 240x160 plate with foreground vault doors, midground bridge, and deep commit-graph background.", "Carries the same code-seer forward and introduces only restrained amber nodes.", "Reads as a new location rather than a brighter copy of the altar scene."]

[[art]]
id = "opening-convergence"
kind = "scene"
summary = "Cyan source energy and gold knowledge meet around the Oracle's still-dark seed."
template = "oracle-awakening"
requirements = ["Uses an authored 240x160 circular chamber with cyan entering from the left and restrained gold from the right.", "Shows an incomplete Oracle eye while reserving maximum white and the complete sigil for the next scene.", "Keeps the code-seer and live skip region readable."]

[[art]]
id = "opening-fanfare"
kind = "scene-vfx"
summary = "The existing cyan-and-gold awakening plate resolves the five-scene story at its brightest Oracle climax."
template = "oracle-awakening"
requirements = ["Uses high-contrast cathedral and sigil silhouettes, a commit-graph constellation, and a complete Oracle sigil rather than borrowed characters or layouts.", "Reserves maximum contrast for this final beat and reaches it only after four darker authored scenes.", "Completes the full five-scene sequence in six seconds at 60 fps.", "Uses staged cuts without full-frame flashes.", "Hands the Oracle motif to the title without sharing or overlaying the fanfare frame."]

[[art]]
id = "title-mark"
kind = "logo"
summary = "A readable pixel-art title treatment for the opening scene."
template = "oracle-title"
requirements = ["Fits inside a 240x160 frame.", "Remains legible at native resolution without glow.", "Redraws the Oracle motif at a restrained baseline after the fanfare clears.", "Supports idle and prompt-pulse states without competing with the title."]

[[art]]
id = "menu-frame"
kind = "ui"
summary = "A rune-and-circuit menu frame that carries the Oracle world into navigation."
template = "oracle-menu"
requirements = ["Fits 240x160 without empty placeholder regions.", "Shows focus through pointer, shape, and color.", "Supports idle, focused, confirmed, and cancelled states."]

[[art]]
id = "character-frame"
kind = "ui-scene"
summary = "A staged code-fantasy workshop for hero customization and truthful Oracle status."
template = "oracle-atelier"
requirements = ["Fits the authored hero, centered native-scale identity labels, and controls inside 240x160.", "Keeps the heading disjoint from every identity row, centers action copy in the usable button interior, and anchors the hero's visible feet to the stage support line.", "Supports loading, retry, and ready without fake progress.", "Keeps the hero preview visually dominant over status copy.", "Does not layer lower-fidelity procedural accessories or weapons over the authored hero sprite."]

[[art]]
id = "hero-set"
kind = "sprite-set"
summary = "Authored hero sprites whose colorway reflects the selected aura while name and path remain textual identity choices."
template = "oracle-hero"
requirements = ["Consistent silhouette across variants.", "Readable on Oracle and quiz backgrounds.", "No procedural accessory or weapon overlays."]

[[art]]
id = "oracle-sanctum"
kind = "scene"
summary = "A readable falling-object playfield that makes question generation feel active."
template = "oracle-sanctum"
requirements = ["Supports the customized hero moving across the full playfield.", "Uses authored cyan-and-gold crystal shards for data and asymmetric magenta corruption glyphs for bugs; no procedural boxes or crossed lines.", "Keeps every falling sprite contained within the live playfield and distinct by silhouette, value, and hue.", "Reserves a top quiz header for the title and Claude status.", "Composes data and corruption counts with themed three-rune meters in the bottom strip; data fills at 3, 6, and 9 while bug hits break containment at 1, 3, and 5.", "Keeps both threshold instruments disjoint from move and B-back prompts at worst-case two-digit counts.", "Has clear loading, retry, ready, and safe-exit states.", "Reflects the current Initiate, Adept, or Oracle-bound presentation tier."]

[[art]]
id = "quiz-frame"
kind = "ui"
summary = "Question, answer, score, flow, and ward-health presentation."
template = "oracle-trial"
requirements = ["Supports four lines of 31-character question copy and four 31-character choices with visible spacing between glyphs and right-side breathing room.", "Keeps every answer glyph and inter-glyph cell disjoint from panel dividers and other static ornaments.", "Keeps focus visible in every state.", "Uses Oracle ward runes, flow multiplier, Insight Rune stages, and raw score to fill the header intentionally without collisions or generic star/heart pips.", "Shows exact 300, 900, and 1800 score crossings and x1, x2, and x3 flow stages while retaining the readable numeric score.", "Turns the correct choice green and an incorrect committed choice red during review without redundant result words.", "Carries the hero and earned presentation tier without reducing question readability."]

[[art]]
id = "reward-frame"
kind = "ui-scene"
summary = "A tier-aware level-up composition that turns mastery into a visible Oracle-bond change."
template = "oracle-ascension"
requirements = ["Telegraphs the threshold, expands the crest once, shows the hero response, and holds the new state before continue.", "Avoids rapid full-background flashing.", "Has a reduced-motion equivalent with the same information and duration."]

[[art]]
id = "result-frame"
kind = "ui-scene"
summary = "A conclusive game-over frame that preserves earned identity and progression while offering replay."
template = "oracle-aftermath"
requirements = ["Shows hero defeat, final score, level, and completed crest state.", "Makes A, B, and Start replay behavior visible.", "Makes the progression reset on a new run explicit."]

[[art]]
id = "run-progression"
kind = "presentation-system"
summary = "Initiate, Adept, and Oracle-bound presentation tiers that make quiz progression perceptible through the final result."
template = "oracle-progression"
requirements = ["Changes at least two non-numeric channels across a run.", "Gives every visible tracked quantity a desirable direction, exact staged thresholds, crossing response, cap, and reset.", "Carries earned bond, Insight Rune, ward, flow, data-charge, and containment states through the scenes where they matter.", "Resets deterministically when a new run begins."]

[[art]]
id = "opening-soundscape"
kind = "audio"
summary = "A constrained chip-style opening arc from dormant credits to the complete Oracle cadence."
requirements = ["Begins near silent with archival ticks and one node pulse.", "Adds layers only as light propagates and reserves the full arrangement for the Oracle crescendo.", "Stops or tails cleanly at the title handoff.", "Has muted and reduced-audio behavior; sound never carries required information alone."]

[[art]]
id = "ui-soundscape"
kind = "audio"
summary = "A coherent interaction vocabulary for title, menu, and hero creation."
requirements = ["Distinguishes navigate, confirm, cancel, unavailable, trait change, and begin-run.", "Emits at most one cue per input edge.", "Owns every loop and one-shot at scene boundaries."]

[[art]]
id = "oracle-soundscape"
kind = "audio"
summary = "A tier-aware Oracle ambience and cue set for Datafall and truthful generation states."
requirements = ["Distinguishes data, bug, retry, ready, and B-back.", "Provides Initiate, Adept, and Oracle-bound ambience variants.", "Stops cleanly on quiz or menu transition."]

[[art]]
id = "quiz-soundscape"
kind = "audio"
summary = "A quiz cue set for focus, commitment, result, danger, streak, and batch completion."
requirements = ["Distinguishes cursor, commit, correct, wrong, low-ward, flow-stage, and batch-complete.", "Prevents result cues from stacking.", "Keeps all required answer feedback visible when muted."]

[[art]]
id = "progression-soundscape"
kind = "audio"
summary = "Reward, defeat, result, and reset music that makes run progression audible."
requirements = ["Adds arrangement layers by progression tier.", "Distinguishes threshold telegraph, reward, defeat, result hold, and replay reset.", "Returns audibly to the Initiate baseline on a new run."]

[[scenes]]
id = "copyright"
title = "Repository Copyright"
kind = "credits"
handler = "repository-credits"
summary = "Credit the people and timeline behind the inserted repository while the first question request begins."
mechanics = ["present-copyright"]
art = ["copyright-card", "opening-soundscape"]

[[scenes.transitions]]
signal = "continue"
target = "opening-fanfare"
after_ticks = 60

[[scenes.transitions]]
signal = "elapsed"
target = "opening-fanfare"
after_ticks = 180

[[scenes]]
id = "opening-fanfare"
title = "The Source Ember"
kind = "cinematic"
handler = "opening-fanfare"
summary = "A lone code-seer discovers one cyan source ember in the dormant archive cathedral."
mechanics = ["play-opening-fanfare"]
art = ["opening-source", "opening-soundscape"]

[[scenes.transitions]]
signal = "continue"
target = "title"
after_ticks = 90

[[scenes.transitions]]
signal = "elapsed"
target = "archive-answer"
after_ticks = 96

[[scenes]]
id = "archive-answer"
title = "The Archive Answers"
kind = "cinematic"
handler = "opening-fanfare"
summary = "The ember reaches the altar and wakes the nearest archive monoliths."
mechanics = ["play-opening-fanfare"]
art = ["opening-signal", "opening-soundscape"]

[[scenes.transitions]]
signal = "continue"
target = "title"

[[scenes.transitions]]
signal = "elapsed"
target = "memory-vault"
after_ticks = 66

[[scenes]]
id = "memory-vault"
title = "The Memory Vault"
kind = "cinematic"
handler = "opening-fanfare"
summary = "The archive opens into a canyon of commit constellations and branching memory."
mechanics = ["play-opening-fanfare"]
art = ["opening-archive", "opening-soundscape"]

[[scenes.transitions]]
signal = "continue"
target = "title"

[[scenes.transitions]]
signal = "elapsed"
target = "convergence"
after_ticks = 66

[[scenes]]
id = "convergence"
title = "The Convergence"
kind = "cinematic"
handler = "opening-fanfare"
summary = "Cyan source energy and gold knowledge spiral around the Oracle's still-dark seed."
mechanics = ["play-opening-fanfare"]
art = ["opening-convergence", "opening-soundscape"]

[[scenes.transitions]]
signal = "continue"
target = "title"

[[scenes.transitions]]
signal = "elapsed"
target = "oracle-awakening"
after_ticks = 66

[[scenes]]
id = "oracle-awakening"
title = "The Oracle Awakens"
kind = "cinematic"
handler = "opening-fanfare"
summary = "The current cyan-and-gold awakening image becomes the earned climax of the story."
mechanics = ["play-opening-fanfare"]
art = ["opening-fanfare", "opening-soundscape"]

[[scenes.transitions]]
signal = "continue"
target = "title"

[[scenes.transitions]]
signal = "elapsed"
target = "title"
after_ticks = 66

[[scenes]]
id = "title"
title = "Title"
kind = "title"
handler = "title"
summary = "Resolve the fanfare into the cartridge title and invite the player to begin."
mechanics = ["begin-from-title"]
art = ["title-mark", "ui-soundscape"]

[[scenes.transitions]]
signal = "continue"
target = "quiz-menu"

[[scenes]]
id = "quiz-menu"
title = "Quiz Menu"
kind = "menu"
handler = "quiz-menu"
summary = "Explain the run at a glance and offer start or return."
mechanics = ["navigate-menu"]
art = ["menu-frame", "ui-soundscape"]

[[scenes.transitions]]
signal = "new-run"
target = "character-creation"

[[scenes.transitions]]
signal = "back"
target = "title"

[[scenes]]
id = "character-creation"
title = "Create Hero"
kind = "character-creation"
handler = "character-creation"
summary = "Let the player establish a small identity before the first question."
mechanics = ["customize-hero"]
art = ["hero-set", "character-frame", "ui-soundscape"]

[[scenes.transitions]]
signal = "hero-ready"
target = "oracle"

[[scenes.transitions]]
signal = "back"
target = "quiz-menu"

[[scenes]]
id = "oracle"
title = "Oracle"
kind = "interstitial"
handler = "oracle"
summary = "Turn question-generation latency into a horizontal falling-object game with a safe B-back recovery path."
mechanics = ["consult-oracle"]
art = ["hero-set", "oracle-sanctum", "oracle-soundscape", "run-progression"]

[[scenes.transitions]]
signal = "questions-ready"
target = "quiz"

[[scenes.transitions]]
signal = "back"
target = "quiz-menu"

[[scenes]]
id = "quiz"
title = "Quiz"
kind = "challenge"
handler = "concept-quiz"
summary = "Test one durable concept about the project."
mechanics = ["answer-question"]
art = ["hero-set", "quiz-frame", "quiz-soundscape", "run-progression"]

[[scenes.transitions]]
signal = "needs-question"
target = "oracle"

[[scenes.transitions]]
signal = "batch-complete"
target = "level-up"

[[scenes.transitions]]
signal = "hearts-empty"
target = "game-over"

[[scenes.transitions]]
signal = "back"
target = "quiz-menu"

[[scenes]]
id = "level-up"
title = "Level Up"
kind = "reward"
handler = "level-up"
summary = "Mark mastery and raise the next question batch's difficulty."
mechanics = ["continue-after-reward"]
art = ["hero-set", "reward-frame", "progression-soundscape", "run-progression"]

[[scenes.transitions]]
signal = "questions-ready"
target = "quiz"
after_ticks = 60

[[scenes.transitions]]
signal = "needs-question"
target = "oracle"
after_ticks = 60

[[scenes]]
id = "game-over"
title = "Game Over"
kind = "result"
handler = "game-over"
summary = "Close the run with the final score and a replay path."
mechanics = ["replay-run"]
art = ["hero-set", "result-frame", "progression-soundscape", "run-progression"]

[[scenes.transitions]]
signal = "replay"
target = "quiz-menu"
